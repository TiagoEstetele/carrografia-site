<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conexão TikTok · Carrografia</title>
<style>body{margin:0;background:#12151A;color:#F2F2EE;font:16px/1.6 system-ui,sans-serif}main{max-width:640px;margin:0 auto;padding:32px 16px}h1{color:#FFB400}code{display:block;word-break:break-all;background:#1C2129;border:2px solid #FFB400;border-radius:10px;padding:14px;font-size:15px}button{margin-top:12px;background:#FFB400;color:#12151A;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}</style></head>
<body><main><h1>Conexão com o TikTok</h1><div id="r"></div>
<p style="opacity:.7;font-size:14px">Página de retorno do Carrografia Publicador. Nenhum dado é guardado aqui; o código aparece só no seu navegador e vale por poucos minutos.</p></main>
<script>
const p=new URLSearchParams(location.search),r=document.getElementById('r');
if(p.get('code')){r.innerHTML='<p>Autorização concedida. Copie o código abaixo e envie para o Claude <b>em até 5 minutos</b>:</p><code id="c"></code><button id="b">Copiar código</button>';
 document.getElementById('c').textContent=p.get('code');
 document.getElementById('b').onclick=()=>{navigator.clipboard.writeText(p.get('code'));document.getElementById('b').textContent='Copiado!'};}
else if(p.get('error')){r.innerHTML='<p>O TikTok recusou a autorização: <b></b></p>';r.querySelector('b').textContent=p.get('error')+' '+(p.get('error_description')||'');}
else r.innerHTML='<p>Nenhum código recebido.</p>';
</script></body></html>
